<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090714" />
  <title>WANZZY • MULTI TOOLS</title>
  <style>
    :root{--bg:#090714;--card:rgba(18,15,37,.72);--card2:rgba(34,26,65,.74);--line:rgba(255,255,255,.13);--text:#fff;--muted:#c8c3d8;--accent:#c56cff;--accent2:#6e7cff;--danger:#ff5e8b;--shadow:0 24px 80px rgba(0,0,0,.42)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg)}
    body{background-image:linear-gradient(180deg,rgba(6,5,17,.56),rgba(6,5,17,.9)),url('/assets/bg.jpg');background-size:cover;background-position:center;background-attachment:fixed}
    button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);padding:30px;border:1px solid var(--line);background:rgba(9,7,20,.68);backdrop-filter:blur(20px);border-radius:28px;box-shadow:var(--shadow)}
    .logo{font-weight:950;letter-spacing:.12em;font-size:28px}.logo span{color:#d995ff}.sub{color:var(--muted);margin:7px 0 25px}.field{margin:14px 0}.field label{display:block;color:#dcd7ea;font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);outline:none;background:rgba(255,255,255,.07);color:white;border-radius:14px;padding:13px 14px}.field textarea{min-height:120px;resize:vertical}.field select option{background:#18132b}
    .btn{border:0;border-radius:14px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(126,91,255,.22);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:rgba(255,75,122,.16);border:1px solid rgba(255,75,122,.28);box-shadow:none}.error{color:#ff9ab7;font-size:13px;margin-top:10px}
    .app{display:flex;min-height:100vh}.side{width:260px;flex:none;padding:22px 16px;border-right:1px solid var(--line);background:rgba(8,6,18,.64);backdrop-filter:blur(18px);position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 10px 22px}.brand small{display:block;color:var(--muted);margin-top:4px}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:left;border:1px solid transparent;color:#eee;background:transparent;padding:12px;border-radius:13px;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);border-color:var(--line)}.nav .ico{display:inline-grid;place-items:center;width:28px;margin-right:7px}.side-foot{margin-top:20px;display:grid;gap:9px}
    main{flex:1;padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:clamp(24px,4vw,38px)}.top p{margin:5px 0 0;color:var(--muted)}.userpill{padding:9px 12px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;font-size:13px}
    .hero{padding:24px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(196,108,255,.17),rgba(95,114,255,.11));box-shadow:var(--shadow);margin-bottom:20px}.hero h2{margin:0 0 7px}.hero p{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.tool{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);border-radius:20px;padding:18px;cursor:pointer;transition:.22s}.tool:hover{transform:translateY(-3px);background:var(--card2);box-shadow:0 18px 45px rgba(0,0,0,.28)}.tool .big{font-size:28px}.tool h3{margin:10px 0 5px}.tool p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.badge{display:inline-block;margin-top:12px;font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:#ddd}.disabled{opacity:.45;cursor:not-allowed}
    .panel{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(16px);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.panel-head h2{margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.result{margin-top:18px}.result pre{margin:0;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:16px;border-radius:16px;max-height:55vh;overflow:auto;color:#eee;font-size:12px;line-height:1.55}.status{margin-top:10px;color:var(--muted);font-size:13px}.img-result{max-width:100%;border-radius:16px;border:1px solid var(--line);display:block}.tool-note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
    .mobile-nav{display:none}
    @media(max-width:850px){.side{display:none}.mobile-nav{display:flex;position:fixed;z-index:10;left:12px;right:12px;bottom:12px;padding:8px;gap:6px;border:1px solid var(--line);background:rgba(9,7,20,.82);backdrop-filter:blur(18px);border-radius:18px}.mobile-nav button{flex:1;border:0;background:transparent;color:#ddd;padding:9px 5px;border-radius:12px;font-size:11px}.mobile-nav button.active{background:rgba(255,255,255,.1)}main{padding:18px 15px 92px}.top{align-items:flex-start}.userpill{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool{padding:14px}.tool h3{font-size:15px}.tool p{font-size:12px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.row>*{min-width:100%}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <div class="login-card">
      <div class="logo">WANZZY <span>TOOLS</span></div>
      <div class="sub">Serbaguna • Anime • Movie • AI • Upload</div>
      <form id="loginForm">
        <div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="Username" required></div>
        <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
        <button class="btn" style="width:100%">LOGIN</button><div id="loginError" class="error"></div><div style="text-align:center;margin-top:14px"><button type="button" id="showRegister" class="btn secondary">Buat akun baru</button></div>
      </form>
    </div>
    <div id="registerCard" class="login-card hidden" style="margin-top:14px">
      <div class="logo">BUAT <span>AKUN</span></div>
      <div class="sub">Daftar sebagai User. Admin dapat dibuat oleh admin dari menu Kelola Akun.</div>
      <form id="registerForm">
        <div class="field"><label>Username</label><input id="regUsername" autocomplete="username" placeholder="Username" required></div>
        <div class="field"><label>Password</label><input id="regPassword" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter" required></div>
        <button class="btn" style="width:100%">DAFTAR</button><div id="registerError" class="error"></div>
      </form>
      <button type="button" id="backLogin" class="btn secondary" style="width:100%;margin-top:10px">Kembali ke Login</button>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside class="side"><div class="brand"><div class="logo">WANZZY</div><small>MULTI TOOLS PANEL</small></div><nav id="nav" class="nav"></nav><div class="side-foot"><button id="logout" class="btn danger">↪ Logout</button></div></aside>
    <main><div class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Pilih tools yang ingin digunakan.</p></div><div class="userpill" id="userPill">● wanzzy</div></div><div id="content"></div></main>
    <nav id="mobileNav" class="mobile-nav"></nav>
  </section>
<script>
const $=s=>document.querySelector(s); const tokenKey='wanzzy_token';
const tools=[
{id:'dashboard',icon:'⌂',name:'Dashboard',desc:'Beranda dan semua tools.'},
{id:'rewind',icon:'✦',name:'Rewind AI',desc:'Chat AI dari API Rewind.'},
{id:'otaku',icon:'◈',name:'OtakuDesu',desc:'Home, search, info, genre & watch.'},
{id:'movies',icon:'🎬',name:'Movies',desc:'Popular, latest, search & detail.'},
{id:'hdhub',icon:'▣',name:'HDHub4u',desc:'Home, pencarian dan detail film.'},
{id:'komik',icon:'漫画',name:'Komik',desc:'Manga, manhwa, top & search.'},
{id:'anime',icon:'⛩',name:'Anime',desc:'Home, search, detail & watch.'},
{id:'tiktok',icon:'♪',name:'TikTok',desc:'Proses link TikTok.'},
{id:'catbox',icon:'☁',name:'Catbox',desc:'Upload file ke Catbox.'},
{id:'iqc',icon:'▤',name:'IQC Maker',desc:'Buat gambar chat IQC.'},
{id:'alightmotion',icon:'✦',name:'AlightMotion',desc:'Kirim dan verifikasi magic link.'},
{id:'global-chat',icon:'💬',name:'Global Chat',desc:'Chat bersama semua user.'},
{id:'accounts',icon:'👥',name:'Kelola Akun',desc:'Buat akun User/Admin dan atur centang biru.'},
{id:'mimo',icon:'AI',name:'MiMo AI',desc:'Modul sumber diunggah, tetapi tidak diaktifkan di dashboard.' ,disabled:true}
];
function api(path,body,opts={}){const isForm=body instanceof FormData;const headers={'Authorization':'Bearer '+localStorage.getItem(tokenKey),...(opts.headers||{})};if(!isForm)headers['Content-Type']='application/json';return fetch(path,{method:'POST',headers,body:isForm?body:JSON.stringify(body)})}
function setView(id){const t=tools.find(x=>x.id===id)||tools[0]; $('#title').textContent=t.name; $('#subtitle').textContent=t.desc; document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id)); if(id==='dashboard')return dashboard(); if(id==='global-chat')return globalChat(); if(id==='accounts')return accounts(); if(t.disabled)return panel('<div class="tool-note">Modul MiMo AI yang diunggah memakai payload kredensial/premium tersandi. Demi keamanan, modul tersebut tidak dieksekusi oleh panel ini.</div>'); ({rewind,otaku,movies,hdhub,komik,anime,tiktok,catbox,iqc,alightmotion}[id])();}
function nav(){const html=tools.map(t=>`<button data-nav="${t.id}" ${t.disabled?'disabled':''}><span class="ico">${t.icon}</span>${t.name}</button>`).join(''); $('#nav').innerHTML=html; $('#mobileNav').innerHTML=html; document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>!b.disabled&&setView(b.dataset.nav));}
function panel(inner){$('#content').innerHTML=`<div class="panel">${inner}</div>`}
function dashboard(){ $('#content').innerHTML=`<div class="hero"><h2>Selamat datang di WANZZY Multi Tools 👋</h2><p>Semua menu dikumpulkan dalam satu dashboard dengan tampilan glassmorphism.</p></div><div class="grid">${tools.filter(t=>t.id!=='dashboard').map(t=>`<article class="tool ${t.disabled?'disabled':''}" onclick="${t.disabled?'':'setView(\''+t.id+'\')'}"><div class="big">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p><span class="badge">${t.disabled?'DISABLED':'OPEN TOOL'}</span></article>`).join('')}</div>`}
function form(title,fields,button='Jalankan'){panel(`<div class="panel-head"><h2>${title}</h2></div><form id="toolForm">${fields}</form><div id="result" class="result"></div>`); return $('#toolForm')}
function out(data){$('#result').innerHTML=`<pre>${escapeHtml(typeof data==='string'?data:JSON.stringify(data,null,2))}</pre>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function rewind(){const f=form('Rewind AI',`<div class="field"><label>Prompt</label><textarea id="prompt" placeholder="Tulis pertanyaan..." required></textarea></div><button class="btn">Kirim</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';try{out(await (await api('/api/rewind',{prompt:$('#prompt').value})).json())}catch(e){out(e.message)}}}
function otaku(){const f=form('OtakuDesu',`<div class="row"><div class="field"><label>Action</label><select id="action"><option value="home">Home</option><option value="search">Search</option><option value="info">Info URL</option><option value="genreList">Genre List</option><option value="genre">Genre</option><option value="watch">Watch URL</option><option value="upcoming">Upcoming</option></select></div><div class="field"><label>Query / URL / Genre</label><input id="q" placeholder="Opsional"></div><div class="field"><label>Page</label><input id="page" type="number" value="1"></div></div><button class="btn">Jalankan</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';const action=$('#action').value;const q=$('#q').value;out(await (await api('/api/otaku',{action,query:q,url:q,genre:q,page:$('#page').value})).json())}}
function movies(){const f=form('Movies',`<div class="row"><div class="field"><label>Action</label><select id="action"><option value="list">List</option><option value="search">Search</option><option value="get">Detail URL</option></select></div><div class="field"><label>Query / URL</label><input id="q" placeholder="Search atau URL"></div><div class="field"><label>List Type</label><select id="listType"><option>popular</option><option>latest</option><option>top-rated</option><option>upcoming</option></select></div></div><button class="btn">Jalankan</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';out(await (await api('/api/movies',{action:$('#action').value,query:$('#q').value,url:$('#q').value,listType:$('#listType').value})).json())}}
function hdhub(){const f=form('HDHub4u',`<div class="row"><div class="field"><label>Action</label><select id="action"><option value="home">Home</option><option value="search">Search</option><option value="detail">Detail URL</option></select></div><div class="field"><label>Query / URL</label><input id="q"></div><div class="field"><label>Page</label><input id="page" type="number" value="1"></div></div><button class="btn">Jalankan</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';out(await (await api('/api/hdhub4u',{action:$('#action').value,query:$('#q').value,url:$('#q').value,page:$('#page').value})).json())}}
function komik(){const f=form('Komik',`<div class="row"><div class="field"><label>Action</label><select id="action"><option value="home">Home</option><option value="top">Top</option><option value="manhwa">Manhwa</option><option value="list">List</option><option value="search">Search</option></select></div><div class="field"><label>Query</label><input id="q"></div><div class="field"><label>Period</label><select id="period"><option>weekly</option><option>daily</option><option>alltime</option></select></div></div><button class="btn">Jalankan</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';out(await (await api('/api/komik',{action:$('#action').value,query:$('#q').value,period:$('#period').value})).json())}}
function anime(){const f=form('Anime',`<div class="row"><div class="field"><label>Action</label><select id="action"><option value="home">Home</option><option value="search">Search</option><option value="detail">Detail URL</option><option value="watch">Watch URL</option></select></div><div class="field"><label>Query / URL</label><input id="q"></div></div><button class="btn">Jalankan</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';out(await (await api('/api/anime',{action:$('#action').value,query:$('#q').value,url:$('#q').value})).json())}}
function tiktok(){const f=form('TikTok Downloader',`<div class="field"><label>Link TikTok</label><input id="url" placeholder="https://www.tiktok.com/..." required></div><button class="btn">Proses</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Memproses...';out(await (await api('/api/tiktok',{url:$('#url').value})).json())}}
function catbox(){panel(`<div class="panel-head"><h2>Catbox Uploader</h2></div><form id="toolForm"><div class="field"><label>Pilih file</label><input id="file" type="file" required></div><button class="btn">Upload</button></form><div id="result" class="result"></div>`);$('#toolForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData();fd.append('file',$('#file').files[0]);$('#result').textContent='Uploading...';const r=await api('/api/catbox',fd);out(await r.json())}}
function iqc(){const f=form('IQC Maker',`<div class="row"><div class="field"><label>Sender</label><select id="sender"><option value="self">self</option><option value="other">other</option></select></div><div class="field"><label>Message</label><input id="message" value="Halo bang!" required></div><div class="field"><label>Time</label><input id="time" value="21:02"></div></div><div class="row"><div class="field"><label>Carrier</label><input id="carrier" value="INDOSAT"></div><div class="field"><label>Battery</label><input id="battery" type="number" value="88"></div><div class="field"><label>Signal 0-5</label><input id="signalStrength" type="number" min="0" max="5" value="4"></div></div><button class="btn">Generate</button>`);f.onsubmit=async e=>{e.preventDefault();$('#result').textContent='Generating...';const body={sender:$('#sender').value,message:$('#message').value,time:$('#time').value,timestamp:$('#time').value,carrier:$('#carrier').value,battery:Number($('#battery').value),signalStrength:Number($('#signalStrength').value),wifi:true,darkMode:true,isDark:true,readStatus:true,emojiStyle:'apple'};const r=await api('/api/iqc',body);if(r.ok){const blob=await r.blob();const url=URL.createObjectURL(blob);$('#result').innerHTML=`<img class="img-result" src="${url}" alt="IQC result"><p><a class="btn" href="${url}" download="iqc.png" style="display:inline-block;margin-top:12px;text-decoration:none">Simpan PNG</a></p>`}else out(await r.text())}}
function alightmotion(){panel(`<div class="panel-head"><h2>AlightMotion Premium Generator</h2><p>Kirim magic link lalu masukkan link yang diterima.</p></div><div class="field"><label>Email</label><input id="amEmail" type="email" placeholder="email@example.com" required></div><div class="row"><button class="btn" id="amSend">Kirim Magic Link</button><button class="btn secondary" id="amVerify" type="button">Verifikasi</button></div><div class="field"><label>Magic Link</label><input id="amLink" placeholder="Tempel magic link di sini"></div><div id="result" class="result"></div>`);$('#amSend').onclick=async()=>{const email=$('#amEmail').value.trim();if(!email){$('#result').textContent='Email wajib diisi.';return}$('#result').textContent='Mengirim...';const r=await api('/api/alightmotion',{action:'send',email});out(await r.json())};$('#amVerify').onclick=async()=>{const email=$('#amEmail').value.trim();const link=$('#amLink').value.trim();if(!email||!link){$('#result').textContent='Email dan magic link wajib diisi.';return}$('#result').textContent='Memverifikasi...';const r=await api('/api/alightmotion',{action:'verify',email,link});out(await r.json())}}
let currentUser=null;
function verifiedBadge(user){return user?.verified?'<span title="Terverifikasi" style="color:#55a8ff;font-weight:900"> ✓</span>':''}
function globalChat(){panel(`<div class="panel-head"><h2>💬 Global Chat</h2><button class="btn secondary" id="refreshChat">Refresh</button></div><div id="chatList" style="height:55vh;overflow:auto;display:grid;gap:9px;padding:4px"></div><form id="chatForm" class="row" style="margin-top:12px"><input id="chatMessage" maxlength="500" placeholder="Tulis pesan..." required><button class="btn" style="flex:0 0 auto">Kirim</button></form><div id="chatStatus" class="status"></div>`); const load=async()=>{const r=await api('/api/global-chat',undefined);const d=await r.json();if(!d.success){$('#chatStatus').textContent=d.error||'Gagal memuat chat';return}const box=$('#chatList');box.innerHTML=d.messages.map(m=>`<div style="padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05)"><b>${escapeHtml(m.username)}${verifiedBadge(m)}</b><span style="float:right;color:var(--muted);font-size:11px">${new Date(m.createdAt).toLocaleTimeString()}</span><div style="margin-top:4px;white-space:pre-wrap;word-break:break-word">${escapeHtml(m.message)}</div></div>`).join('')||'<div class="tool-note">Belum ada pesan.</div>';box.scrollTop=box.scrollHeight};$('#refreshChat').onclick=load;$('#chatForm').onsubmit=async e=>{e.preventDefault();const input=$('#chatMessage');const r=await api('/api/global-chat',{message:input.value});const d=await r.json();if(!d.success){$('#chatStatus').textContent=d.error||'Gagal mengirim';return}input.value='';await load()};load()}
function accounts(){if(currentUser?.role!=='admin')return panel('<h2>Akses ditolak</h2><p class="tool-note">Menu ini hanya untuk admin.</p>');panel(`<div class="panel-head"><h2>👥 Kelola Akun</h2><button class="btn secondary" id="refreshUsers">Refresh</button></div><form id="accountForm"><div class="row"><div class="field"><label>Username</label><input id="newUser" required></div><div class="field"><label>Password</label><input id="newPass" type="password" minlength="6" required></div><div class="field"><label>Role</label><select id="newRole"><option value="user">User</option><option value="admin">Admin</option></select></div></div><button class="btn">Buat Akun</button></form><div id="accountResult" class="result"></div>`);const load=async()=>{const r=await api('/api/accounts',undefined);const d=await r.json();if(!d.success){$('#accountResult').textContent=d.error;return}$('#accountResult').innerHTML=`<div style="display:grid;gap:8px">${d.users.map(u=>`<div style="padding:12px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;justify-content:space-between"><div><b>${escapeHtml(u.username)}${verifiedBadge(u)}</b><div class="tool-note">${u.role.toUpperCase()}${u.owner?' • OWNER':''}</div></div>${u.owner?'':`<button class="btn ${u.verified?'danger':'secondary'}" data-verify="${escapeHtml(u.username)}">${u.verified?'Cabut ✓':'Beri ✓'}</button>`}</div>`).join('')}</div>`;document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=async()=>{await api('/api/verify-user',{username:b.dataset.verify,verified:!b.classList.contains('danger')});load()})};$('#accountForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/accounts',{username:$('#newUser').value,password:$('#newPass').value,role:$('#newRole').value});const d=await r.json();$('#accountResult').textContent=d.success?'Akun berhasil dibuat.':(d.error||'Gagal');if(d.success){$('#newUser').value='';$('#newPass').value='';load()}};$('#refreshUsers').onclick=load;load()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const d=await r.json();if(d.success){localStorage.setItem(tokenKey,d.token);showApp()}else $('#loginError').textContent=d.error||'Login gagal.'};
$('#registerForm').onsubmit=async e=>{e.preventDefault();$('#registerError').textContent='';const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#regUsername').value,password:$('#regPassword').value})});const d=await r.json();if(d.success){localStorage.setItem(tokenKey,d.token);showApp()}else $('#registerError').textContent=d.error||'Pendaftaran gagal.'};
$('#showRegister').onclick=()=>{$('#login').querySelector('.login-card').classList.add('hidden');$('#registerCard').classList.remove('hidden')};
$('#backLogin').onclick=()=>{$('#registerCard').classList.add('hidden');$('#login').querySelector('.login-card').classList.remove('hidden')};
async function showApp(){const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+localStorage.getItem(tokenKey)}});if(!r.ok){localStorage.removeItem(tokenKey);return}const d=await r.json();currentUser=d.user;$('#userPill').innerHTML=`● ${escapeHtml(currentUser.username)}${verifiedBadge(currentUser)}`;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');nav();document.querySelectorAll('[data-nav="accounts"]').forEach(b=>{if(currentUser.role!=='admin')b.style.display='none'});setView('dashboard')}
$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+localStorage.getItem(tokenKey)}});localStorage.removeItem(tokenKey);location.reload()};
if(localStorage.getItem(tokenKey))showApp();
</script>
</body>
</html>
